name: Atlas
options:
  bundleIdPrefix: com.atlasfield
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  AtlasCore:
    path: Packages/AtlasCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes:
          - Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Features/Business/Tests
          - Features/Projects/Tests
          - Adapters/Tests
          - UITests
    resources:
      - Apps/iOS/Resources/PrivacyInfo.xcprivacy
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        NSCameraUsageDescription: "Камера нужна для 3D-съёмки, AR-рулетки, обмеров и фотофиксации объекта."
        NSLocationWhenInUseUsageDescription: "Во время съёмки положение, время и точность автоматически сохраняются с геометкой сканов и фото. Метку можно исправить вручную."
        NSMotionUsageDescription: "Гироскоп и акселерометр используются для уровня и определения наклона устройства во время обмеров."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasfield.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: AtlasCore
        product: AtlasCore
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOS/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasfield.app.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atlas
    dependencies:
      - target: Atlas
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    run:
      config: Debug
    archive:
      config: Release
  AtlasUITests:
    build:
      targets:
        Atlas: [test]
        AtlasUITests: [test]
    test:
      config: Debug
      targets:
        - AtlasUITests

