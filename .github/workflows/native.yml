name: Native iOS and portable core

on:
  push:
    paths-ignore:
      - .github/preview-command.json
      - .github/workflows/preview-control.yml
      - docs/**
      - README.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project generator dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Show actual Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Verify checked-in Xcode project matches source tree
        run: python3 Scripts/generate-xcode-project.py --check
      - name: Independently validate Xcode source and resource membership
        run: xcrun swift Scripts/check-project.swift
      - name: Test portable AtlasCore on macOS
        working-directory: Packages/AtlasCore
        run: xcrun swift test
      - name: Check actual business storage and OBJ geometry loader
        run: |
          bash Apps/iOS/Features/Business/Tests/checks.sh
          bash Apps/iOS/Features/Projects/Tests/checks.sh
          bash Apps/iOS/Adapters/Tests/checks.sh
      - name: Build native iOS app against simulator SDK
        run: bash Scripts/check-native.sh
      - name: Retain native build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-results
          path: artifacts/native/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - name: Install locked server dependencies
        working-directory: Server
        run: npm ci
      - name: Check server contracts and behavior
        working-directory: Server
        run: |
          npm run build
          npm test
