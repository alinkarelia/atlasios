name: Attach private native runtime evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed native Simulator runtime QA run with screenshots or diagnostics'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-runtime-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: v0.3.0-qa-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Verify private repository and the original runtime QA run
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['SOURCE_RUN_ID']
          if os.environ['GITHUB_REF'] != 'refs/heads/main' or not re.fullmatch(r'[0-9]{1,20}', run_id):
              raise SystemExit('Run this publisher from main with a decimal source run ID.')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          if api(f'repos/{repository}').get('private') is not True:
              raise SystemExit('Runtime evidence may only be attached to this private repository.')
          run = api(f'repos/{repository}/actions/runs/{run_id}')
          if (run.get('status') != 'completed'
                  or run.get('conclusion') not in ('success', 'failure', 'cancelled', 'timed_out')
                  or run.get('name') != 'Native Simulator runtime QA'
                  or run.get('path') != '.github/workflows/runtime-qa.yml'
                  or run.get('repository', {}).get('full_name') != repository
                  or not re.fullmatch(r'[0-9a-f]{40}', run.get('head_sha', ''))):
              raise SystemExit('Source is not a completed native runtime QA run from this repository.')
          manifest = {'repository': repository, 'sourceRunID': run_id,
                      'sourceSHA': run['head_sha'], 'sourceBranch': run['head_branch'],
                      'workflow': run['path'], 'conclusion': run['conclusion'],
                      'runURL': run['html_url'], 'startedAt': run['run_started_at'],
                      'scope': 'Native iOS Simulator screenshots and diagnostics; physical camera and LiDAR are not verified.'}
          directory = pathlib.Path('artifacts/runtime-publication')
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'source-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          print(json.dumps(manifest))
          PY
      - name: Download only the original native runtime screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: native-runtime-screenshots-and-diagnostics
          path: artifacts/runtime-publication/evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Attach immutable evidence ZIP and checksum to a private QA prerelease
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess, zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          root = pathlib.Path('artifacts/runtime-publication')
          evidence = root / 'evidence'
          manifest = json.loads((root / 'source-manifest.json').read_text())
          files = sorted(path for path in evidence.rglob('*') if path.is_file())
          if not files or len(files) > 10000 or sum(path.stat().st_size for path in files) > 512 * 1024 * 1024:
              raise SystemExit('Evidence artifact is empty or unexpectedly large.')
          attachments = evidence / 'screenshots' / 'test-attachments'
          attachment_manifest = attachments / 'manifest.json'
          exported = set()
          if attachment_manifest.is_file():
              for test in json.loads(attachment_manifest.read_text()):
                  for attachment in test.get('attachments', []):
                      name = attachment.get('exportedFileName', '')
                      if pathlib.Path(name).name == name:
                          exported.add(name)
          def extensionless_diagnostic(path):
              # Failed XCTest runs also export UUID-named text/image attachments
              # without extensions. Admit only original manifest-backed files;
              # an arbitrary binary file is still rejected.
              if not re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}', path.name):
                  return False
              data = path.read_bytes()
              if data.startswith(b'\x89PNG\r\n\x1a\n') or data.startswith(b'\xff\xd8\xff'):
                  return True
              if path.parent != attachments or path.name not in exported:
                  return False
              try:
                  return b'\x00' not in data and bool(data.decode('utf-8').strip())
              except UnicodeDecodeError:
                  return False
          included, omitted = [], []
          for path in files:
              if path.is_symlink() or not path.resolve().is_relative_to(evidence.resolve()):
                  raise SystemExit('Evidence artifact contains an unexpected link or path.')
              if (path.suffix.lower() not in ('.png', '.jpg', '.jpeg', '.json', '.log', '.ips', '.txt', '.csv')
                      and not extensionless_diagnostic(path)):
                  relative = path.relative_to(evidence)
                  if ('test-attachments' in relative.parts[:-1]
                          and re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}(?:\.[A-Za-z0-9]{1,10})?', path.name)):
                      omitted.append({'path': relative.as_posix(), 'size': path.stat().st_size,
                                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                                      'reason': 'Non-image/text XCTest attachment; original artifact is retained on the source run.'})
                      continue
                  raise SystemExit(f'Unexpected runtime evidence file type: {path.relative_to(evidence)}')
              included.append(path)
          archive = root / f"runtime-{os.environ['SOURCE_RUN_ID']}.zip"
          entries = [('source-manifest.json', root / 'source-manifest.json')]
          if omitted:
              omission_manifest = root / 'evidence-omissions.json'
              omission_manifest.write_text(json.dumps({'sourceRunURL': manifest['runURL'], 'omitted': omitted},
                                                       sort_keys=True, indent=2) + '\n')
              manifest['omittedAttachmentCount'] = len(omitted)
              manifest['omissionsManifest'] = omission_manifest.name
              (root / 'source-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
              entries.append((omission_manifest.name, omission_manifest))
              print(f'Omitted {len(omitted)} opaque XCTest attachments; provenance is recorded in evidence-omissions.json.')
          entries += [('evidence/' + path.relative_to(evidence).as_posix(), path) for path in included]
          with zipfile.ZipFile(archive, 'w') as output:
              for name, path in entries:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  output.writestr(info, path.read_bytes())
          with zipfile.ZipFile(archive) as zipped:
              if len(zipped.namelist()) != len(set(zipped.namelist())) or zipped.testzip() is not None:
                  raise SystemExit('Evidence ZIP integrity validation failed.')
          checksum = archive.with_name(archive.name + '.sha256')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum.write_text(f'{digest}  {archive.name}\n', encoding='ascii')
          def call(*arguments):
              return subprocess.check_output(['gh', *arguments], text=True)
          def private():
              if json.loads(call('api', f'repos/{repository}')).get('private') is not True:
                  raise SystemExit('Repository privacy changed; evidence publication stopped.')
          private()
          pages = json.loads(call('api', '--paginate', '--slurp', f'repos/{repository}/releases?per_page=100'))
          releases = [release for page in pages for release in page if release.get('tag_name') == tag]
          if len(releases) > 1:
              raise SystemExit('QA evidence release tag is ambiguous.')
          if releases:
              release = releases[0]
              if (release.get('draft') or release.get('prerelease') is not True
                      or release.get('name') != 'Atlas 0.3 — private native QA evidence'):
                  raise SystemExit('Existing tag is not the expected private QA evidence prerelease.')
          else:
              notes = root / 'release-notes.txt'
              notes.write_text('Private native Simulator runtime QA evidence.\n\n'
                               'Each immutable runtime-<run_id>.zip includes the original source SHA, run URL, '
                               'result, screenshots and diagnostics in source-manifest.json. '
                               'This collection contains before/after native UI evidence and may include failed '
                               'test diagnostics. It does not establish physical camera, LiDAR or measurement accuracy.\n')
              call('release', 'create', tag, '--repo', repository, '--target', manifest['sourceSHA'],
                   '--prerelease', '--title', 'Atlas 0.3 — private native QA evidence', '--notes-file', str(notes))
              release = json.loads(call('api', f'repos/{repository}/releases/tags/{tag}'))
          if release.get('tag_name') != tag or release.get('draft') or release.get('prerelease') is not True:
              raise SystemExit('Unexpected QA evidence release state.')
          private()
          assets = {asset['name']: asset for asset in release.get('assets', [])}
          for path in (archive, checksum):
              current_digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name in assets:
                  if assets[path.name].get('digest') != f'sha256:{current_digest}':
                      raise SystemExit(f'Existing evidence asset differs; refusing replacement: {path.name}')
              else:
                  call('release', 'upload', tag, str(path), '--repo', repository)
          print(json.dumps({'releaseURL': release['html_url'], 'archive': archive.name,
                            'sha256': digest, 'sourceSHA': manifest['sourceSHA'], 'sourceRunID': manifest['sourceRunID']}))
          PY
