name: Build unsigned iPhone preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-preview:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project generator dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Show actual Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Verify checked-in project
        run: |
          python3 Scripts/generate-xcode-project.py --check
          xcrun swift Scripts/check-project.swift
      - name: Test portable AtlasCore on macOS
        working-directory: Packages/AtlasCore
        run: xcrun swift test
      - name: Check actual business storage, OBJ geometry, and EXIF metadata
        run: |
          bash Apps/iOS/Features/Business/Tests/checks.sh
          bash Apps/iOS/Features/Projects/Tests/checks.sh
          bash Apps/iOS/Adapters/Tests/checks.sh
      - name: Compile and package unsigned device app
        run: bash Scripts/build-device-ipa.sh
      - name: Downloadable IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-unsigned-device-IPA
          path: artifacts/device-preview/Atlas-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Retain native device build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-results
          path: artifacts/device-preview/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
