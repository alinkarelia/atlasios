name: Attach preview source archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-preview-sources-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.3.1-preview.4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.1-preview.4
      - name: Validate release and attach its canonical sources
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          def call(*arguments):
              return subprocess.check_output(['gh', *arguments], text=True)
          def release_state():
              if json.loads(call('api', f'repos/{repository}')).get('private') is not True:
                  raise SystemExit('Source publication requires a private repository.')
              release = json.loads(call('api', f'repos/{repository}/releases/tags/{tag}'))
              if (release.get('tag_name') != tag or release.get('draft')
                      or release.get('prerelease') is not True
                      or release.get('target_commitish') != source_sha):
                  raise SystemExit('Release is not the prerelease for the checked-out source commit.')
              return release
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Run source publication from the main branch.')
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          release_state()
          directory = pathlib.Path('artifacts')
          directory.mkdir(exist_ok=True)
          archive = directory / 'atlas-source.zip'
          subprocess.run(['git', 'archive', '--format=zip', '--prefix=atlas/',
                          '--output', str(archive), 'HEAD'], check=True)
          with zipfile.ZipFile(archive) as source_zip:
              names = source_zip.namelist()
              required = {'atlas/Atlas.xcodeproj/project.pbxproj', 'atlas/Apps/iOS/Info.plist',
                          'atlas/Packages/AtlasCore/Package.swift', 'atlas/Scripts/build-device-ipa.sh'}
              if (len(names) != len(set(names)) or not required.issubset(names)
                      or any(not name.startswith('atlas/') for name in names)
                      or source_zip.testzip() is not None):
                  raise SystemExit('Source ZIP contents or CRC validation failed.')
          checksum = archive.with_name(archive.name + '.sha256')
          with checksum.open('w', encoding='ascii') as output:
              subprocess.run(['sha256sum', archive.name], cwd=directory, stdout=output, check=True)
          release = release_state()
          assets = {asset['name']: asset for asset in release.get('assets', [])}
          files = []
          for file in (archive, checksum):
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              if file.name in assets:
                  if assets[file.name].get('digest') != f'sha256:{digest}':
                      raise SystemExit(f'Existing source asset {file.name} differs; refusing to replace it.')
              else:
                  call('release', 'upload', tag, str(file), '--repo', repository)
              files.append({'file': file.name, 'bytes': file.stat().st_size, 'sha256': digest})
          print(json.dumps({'release_url': release['html_url'], 'source_sha': source_sha, 'files': files}))
          PY
      - name: Keep the canonical preview source archive for authenticated download
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-preview-source-archive
          path: |
            artifacts/atlas-source.zip
            artifacts/atlas-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
