name: DEBUG diagnostic — one surface form (not release acceptance)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-one-surface-form-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: DEBUG only — unchanged surface UI case on exact 281b773
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 281b77344235df70fd23516ca5e9536efe5aa0a3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select actual Xcode 16.4 for this DEBUG diagnosis
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
          test "$(git rev-parse HEAD)" = 281b77344235df70fd23516ca5e9536efe5aa0a3
      - name: Install deterministic project generator dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Select one existing UI case in the runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/check-runtime.sh')
          source = path.read_text()
          marker = '-resultBundlePath "$result_bundle" -parallel-testing-enabled NO '
          if source.count(marker) != 1:
              raise SystemExit('The original runtime harness test invocation changed; refusing an ambiguous patch.')
          selected = '-only-testing:AtlasUITests/AtlasUITests/testSurfaceClassificationAndManualCabinetDoorPersistWithoutChangingTheSource '
          path.write_text(source.replace(marker, marker + selected))
          print('DEBUG diagnosis only: app and every UI assertion remain at exact source 281b773. This single case is not release acceptance.')
          PY
          git diff --exit-code -- Apps/iOS Packages/AtlasCore
          git diff -- Scripts/check-runtime.sh
      - name: Run the unchanged surface case and retain actual diagnostics
        env:
          ATLAS_RUNTIME_IOS_MAJOR: '18'
        run: |
          mkdir -p artifacts/runtime/diagnostics
          set -o pipefail
          bash Scripts/check-runtime.sh 2>&1 | tee artifacts/runtime/diagnostics/debug-one-surface-case.log
      - name: Keep DEBUG screenshots, exact interactions and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEBUG-only-surface-281b773-iOS18-diagnostics
          path: |
            artifacts/runtime/screenshots/**
            artifacts/runtime/diagnostics/**
            artifacts/runtime/simulator-selection.json
            artifacts/runtime/runtimes.json
          if-no-files-found: warn
          retention-days: 3
