name: DEBUG diagnostic — one surface form (not release acceptance)
run-name: DEBUG only surface form — source 19 711b34a — both iOS generations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-one-surface-form-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: DEBUG surface only — Xcode ${{ matrix.toolchain }} / iOS ${{ matrix.ios_major }} / exact 711b34a
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: '16.4'
            ios_major: '18'
          - toolchain: '26'
            ios_major: '26'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 711b34a1c7a93298b87e5e9117ad6268e41149fc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the actual Apple toolchain for this DEBUG diagnosis
        env:
          ATLAS_RUNTIME_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          python3 - <<'PY' > /tmp/atlas-debug-selected-xcode.txt
          import os, pathlib, re
          if os.environ['ATLAS_RUNTIME_TOOLCHAIN'] == '26':
              candidates = []
              for app in pathlib.Path('/Applications').glob('Xcode_26*.app'):
                  match = re.fullmatch(r'Xcode_(26(?:\.\d+){0,2})\.app', app.name)
                  if match:
                      candidates.append((tuple(int(part) for part in match[1].split('.')), app))
              if not candidates:
                  raise SystemExit('This runner has no installed stable Xcode 26 toolchain.')
              app = max(candidates)[1]
          else:
              app = pathlib.Path('/Applications/Xcode_16.4.app')
          developer = app / 'Contents/Developer'
          if not developer.is_dir():
              raise SystemExit(f'Required Apple toolchain is missing: {app}')
          print(developer)
          PY
          sudo xcode-select -s "$(cat /tmp/atlas-debug-selected-xcode.txt)"
          xcodebuild -version
          xcrun swift --version
          test "$(git rev-parse HEAD)" = 711b34a1c7a93298b87e5e9117ad6268e41149fc
      - name: Install deterministic project generator dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Select one existing UI case in the runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/check-runtime.sh')
          source = path.read_text()
          marker = '-resultBundlePath "$result_bundle" -parallel-testing-enabled NO '
          if source.count(marker) != 1:
              raise SystemExit('The original runtime harness test invocation changed; refusing an ambiguous patch.')
          selected = '-only-testing:AtlasUITests/AtlasUITests/testSurfaceClassificationAndManualCabinetDoorPersistWithoutChangingTheSource '
          path.write_text(source.replace(marker, marker + selected))
          print('DEBUG diagnosis only: app and every UI assertion remain at exact source 711b34a. This single case is not release acceptance.')
          PY
          git diff --exit-code -- Apps/iOS Packages/AtlasCore
          git diff -- Scripts/check-runtime.sh
      - name: Run the unchanged surface case and retain actual diagnostics
        env:
          ATLAS_RUNTIME_IOS_MAJOR: ${{ matrix.ios_major }}
        run: |
          mkdir -p artifacts/runtime/diagnostics
          set -o pipefail
          bash Scripts/check-runtime.sh 2>&1 | tee artifacts/runtime/diagnostics/debug-one-surface-case.log
      - name: Keep DEBUG screenshots, exact interactions and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DEBUG-only-surface-source19-711b34a-iOS${{ matrix.ios_major }}-diagnostics
          path: |
            artifacts/runtime/screenshots/**
            artifacts/runtime/diagnostics/**
            artifacts/runtime/simulator-selection.json
            artifacts/runtime/runtimes.json
          if-no-files-found: warn
          retention-days: 3
